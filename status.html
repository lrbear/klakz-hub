<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klakz Hub | Status</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(13, 13, 25, 0.7);
            --neon-blue: #00f0ff;
            --neon-purple: #b000ff;
            --text-color: #ffffff;
            --text-secondary: #8b8bb4;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; position: relative; overflow-x: hidden; }

        body::before {
            content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: radial-gradient(circle, rgba(176,0,255,0.08) 10%, transparent 10%), radial-gradient(circle, rgba(0,240,255,0.05) 10%, transparent 10%);
            background-size: 30px 30px; animation: gridMove 20s linear infinite; z-index: -1;
        }
        @keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 20px 50px;
            background: rgba(5, 5, 10, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
        nav ul { display: flex; list-style: none; gap: 25px; }
        nav a { color: var(--text-secondary); text-decoration: none; font-weight: 600; transition: 0.3s; position: relative; padding: 5px 0; }
        nav a:hover, nav a.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        .page-title { font-size: 32px; margin-bottom: 25px; text-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }

        .status-list { display: flex; flex-direction: column; gap: 15px; }
        .status-item {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px 25px;
            backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
        }
        .status-item:hover { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
        .service-name { font-size: 18px; font-weight: bold; }
        .badge {
            padding: 6px 15px; border-radius: 20px; font-size: 14px; font-weight: bold;
            background: rgba(0, 255, 102, 0.1); color: #00ff66; border: 1px solid rgba(0, 255, 102, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">KLAKZ HUB</div>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="script.html">Scripts</a></li>
                <li><a href="key.html">Key System</a></li>
                <li><a href="status.html" class="active">Status</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 class="page-title">Sistem Durumu</h1>
        <div class="status-list">
            <div class="status-item">
                <span class="service-name">Ana Hub API (Vercel)</span>
                <span class="badge">ÇEVRİMİÇİ</span>
            </div>
            <div class="status-item">
                <span class="service-name">Key Doğrulama Sunucusu</span>
                <span class="badge">ÇEVRİMİÇİ</span>
            </div>
            <div class="status-item">
                <span class="service-name">Script Güncelleme Servisi</span>
                <span class="badge">ÇEVRİMİÇİ</span>
            </div>
        </div>
    </div>
</body>
</html>
