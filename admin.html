<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klakz Hub | Admin Panel</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(13, 13, 25, 0.75);
            --neon-blue: #00f0ff;
            --neon-purple: #b000ff;
            --text-color: #ffffff;
            --text-secondary: #8b8bb4;
            --border-color: rgba(0, 240, 255, 0.25);
            --border-hover: rgba(0, 240, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Arka plan parlama efektleri */
        body::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: rgba(176, 0, 255, 0.12);
            filter: blur(120px);
            z-index: -1;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: rgba(0, 240, 255, 0.12);
            filter: blur(120px);
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 700;
            border-left: 4px solid var(--neon-blue);
            padding-left: 12px;
        }

        /* Giriş Bölümü */
        #loginSection {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(16px);
            max-width: 450px;
            margin: 100px auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #loginSection h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #fff;
        }

        #adminPanel {
            display: none;
        }

        /* Admin Kartları */
        .admin-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            backdrop-filter: blur(12px);
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .admin-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 4px 25px rgba(0, 240, 255, 0.1);
        }

        .admin-card h3 {
            font-size: 18px;
            margin-bottom: 18px;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(5, 5, 10, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        /* Şık Buton Tasarımı */
        .btn {
            padding: 11px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #fff;
            border: none;
            font-size: 14px;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(176, 0, 255, 0.5);
        }

        .error {
            color: #ff3366;
            margin-top: 12px;
            font-size: 13px;
            display: none;
        }

        @media(max-width: 768px) {
            header { padding: 15px 20px; }
            .container { margin: 20px 10px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">KLAKZ HUB // ADMIN</div>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="script.html">Scripts</a></li>
                <li><a href="key.html">Key System</a></li>
                <li><a href="status.html">Status</a></li>
                <li><a href="admin.html" style="color: var(--neon-purple);">Admin</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <!-- Giriş Ekranı -->
        <div id="loginSection">
            <h2>🔐 Yetkili Girişi</h2>
            <input type="password" id="adminPassword" class="form-control" placeholder="Admin şifresini girin..." style="margin-bottom: 15px;">
            <button class="btn" onclick="checkAdminPassword()" style="width: 100%;">Giriş Yap</button>
            <div id="loginError" class="error">Hatalı şifre!</div>
        </div>

        <!-- Yönetim Paneli -->
        <div id="adminPanel">
            <h1 class="page-title">Yönetim ve Bulut Kontrol Paneli</h1>

            <!-- Key Güncelleme -->
            <div class="admin-card">
                <h3>🔑 Key Sisteminin Şifresini Değiştir</h3>
                <div class="form-group">
                    <input type="text" id="newKeyInput" class="form-control" placeholder="Yeni erişim key'ini yazın...">
                </div>
                <button class="btn" onclick="updateKey()">Key'i Güncelle</button>
            </div>

            <!-- Sistem Durumu Güncelleme -->
            <div class="admin-card">
                <h3>⚡ Sistem Durumunu Değiştir (Status)</h3>
                <div class="form-group">
                    <select id="statusApi" class="form-control">
                        <option value="ÇEVRİMİÇİ">Çevrimiçi (Aktif)</option>
                        <option value="BAKIMDA">Bakımda</option>
                        <option value="ÇEVRİMDIŞI">Çevrimdışı</option>
                    </select>
                </div>
                <button class="btn" onclick="updateStatus()">Durumu Güncelle</button>
            </div>

            <!-- Yeni Script Ekleme -->
            <div class="admin-card">
                <h3>📜 Yeni Script Ekle</h3>
                <div class="form-group"><input type="text" id="scriptTitle" class="form-control" placeholder="Script Başlığı (Örn: Hub v1)"></div>
                <div class="form-group"><input type="text" id="scriptDesc" class="form-control" placeholder="Kısa Açıklama"></div>
                <div class="form-group"><input type="text" id="scriptCode" class="form-control" placeholder="Loadstring kodu..."></div>
                <button class="btn" onclick="addNewScript()">Scripti Buluta Ekle</button>
            </div>

            <!-- Reklam ve Sponsor Yönetimi -->
            <div class="admin-card">
                <h3>📢 Reklam ve Sponsor Yönetimi</h3>
                <div class="form-group">
                    <label>Reklam Türü Seçin:</label>
                    <select id="adType" class="form-control" onchange="toggleAdInputs()">
                        <option value="code">Google Ads / HTML Kod (AdSense)</option>
                        <option value="banner">Sponsor Banner (Görsel + Link)</option>
                    </select>
                </div>

                <!-- Google Ads / Kod Alanı -->
                <div class="form-group" id="codeGroup">
                    <label>AdSense / HTML Script Kodu:</label>
                    <textarea id="adHtmlCode" class="form-control" placeholder="Google AdSense kodunu buraya yapıştır..."></textarea>
                </div>

                <!-- Sponsor Banner Alanı -->
                <div id="bannerGroup" style="display: none;">
                    <div class="form-group">
                        <label>Banner Görsel Linki (Resim URL):</label>
                        <input type="text" id="adImageUrl" class="form-control" placeholder="https://ornek.com/banner.png">
                    </div>
                    <div class="form-group">
                        <label>Sponsor Gideceği Link (URL):</label>
                        <input type="text" id="adTargetUrl" class="form-control" placeholder="https://sponsorwebsite.com">
                    </div>
                </div>

                <button class="btn" onclick="updateAdvertisement()">Reklamı Güncelle & Yayınla</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, ref, set, push } from "./firebase-config.js";

        const ADMIN_SECRET = "klakz123";

        window.checkAdminPassword = function() {
            let pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_SECRET) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        window.updateKey = function() {
            let newKey = document.getElementById('newKeyInput').value.trim();
            if (newKey) {
                set(ref(db, 'settings/correctKey'), newKey).then(() => {
                    alert("Key buluta kaydedildi ve tüm cihazlarda güncellendi!");
                    document.getElementById('newKeyInput').value = '';
                });
            }
        }

        window.updateStatus = function() {
            let apiStatus = document.getElementById('statusApi').value;
            set(ref(db, 'settings/statusApi'), apiStatus).then(() => {
                alert("Sistem durumu bulutta güncellendi!");
            });
        }

        window.addNewScript = function() {
            let title = document.getElementById('scriptTitle').value;
            let desc = document.getElementById('scriptDesc').value;
            let code = document.getElementById('scriptCode').value;

            if (title && desc && code) {
                push(ref(db, 'scripts'), { title, desc, code }).then(() => {
                    alert("Script buluta eklendi ve tüm cihazlara yansıtıldı!");
                    document.getElementById('scriptTitle').value = '';
                    document.getElementById('scriptDesc').value = '';
                    document.getElementById('scriptCode').value = '';
                });
            }
        }

        window.toggleAdInputs = function() {
            let type = document.getElementById('adType').value;
            if(type === 'code') {
                document.getElementById('codeGroup').style.display = 'block';
                document.getElementById('bannerGroup').style.display = 'none';
            } else {
                document.getElementById('codeGroup').style.display = 'none';
                document.getElementById('bannerGroup').style.display = 'block';
            }
        }

        window.updateAdvertisement = function() {
            let type = document.getElementById('adType').value;
            let adData = { type: type };

            if(type === 'code') {
                adData.htmlCode = document.getElementById('adHtmlCode').value;
            } else {
                adData.imageUrl = document.getElementById('adImageUrl').value;
                adData.targetUrl = document.getElementById('adTargetUrl').value;
            }

            set(ref(db, 'advertisement'), adData).then(() => {
                alert("Reklam başarıyla güncellendi ve tüm cihazlara yansıtıldı!");
            });
        }
    </script>
</body>
</html>
