<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klakz Hub | Admin Panel</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(13, 13, 25, 0.7);
            --neon-blue: #00f0ff;
            --neon-purple: #b000ff;
            --text-color: #ffffff;
            --text-secondary: #8b8bb4;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; position: relative; overflow-x: hidden; }

        body::before {
            content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: radial-gradient(circle, rgba(176,0,255,0.08) 10%, transparent 10%), radial-gradient(circle, rgba(0,240,255,0.05) 10%, transparent 10%);
            background-size: 30px 30px; animation: gridMove 20s linear infinite; z-index: -1;
        }
        @keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 20px 50px;
            background: rgba(5, 5, 10, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
        nav ul { display: flex; list-style: none; gap: 25px; align-items: center; }
        nav a { color: var(--text-secondary); text-decoration: none; font-weight: 600; transition: 0.3s; position: relative; padding: 5px 0; }
        nav a:hover, nav a.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-size: 32px; margin-bottom: 25px; text-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }

        #loginSection {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 40px; text-align: center; backdrop-filter: blur(15px); max-width: 500px; margin: 100px auto;
        }
        #loginSection h2 { margin-bottom: 20px; }

        #adminPanel { display: none; }
        .admin-card {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px;
            backdrop-filter: blur(10px); margin-bottom: 25px;
        }
        .admin-card h3 { font-size: 20px; margin-bottom: 15px; color: var(--neon-blue); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: var(--text-secondary); margin-bottom: 5px; font-size: 14px; }
        .form-control {
            width: 100%; padding: 12px 15px; background: rgba(5, 5, 10, 0.6); border: 1px solid var(--border-color);
            border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }

        .btn {
            padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple)); color: #fff; border: none;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); font-size: 15px;
        }
        .btn:hover { box-shadow: 0 0 25px var(--neon-blue); transform: scale(1.02); }
        .error { color: #ff3366; margin-top: 10px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <header>
        <div class="logo">KLAKZ HUB - ADMIN</div>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="script.html">Scripts</a></li>
                <li><a href="key.html">Key System</a></li>
                <li><a href="status.html">Status</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="admin.html" class="active" style="color: var(--neon-purple);">Admin</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <!-- ŞİFRE GİRİŞ EKRANI -->
        <div id="loginSection">
            <h2>Admin Girişi</h2>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">Yönetim paneline erişmek için şifrenizi girin.</p>
            <input type="password" id="adminPassword" class="form-control" placeholder="Admin Şifresi (klakz123)..." style="margin-bottom: 15px;">
            <button class="btn" onclick="checkAdminPassword()">Giriş Yap</button>
            <div id="loginError" class="error">Hatalı şifre! (Varsayılan: klakz123)</div>
        </div>

        <!-- YÖNETİM PANELİ -->
        <div id="adminPanel">
            <h1 class="page-title">Yönetim Paneli</h1>

            <!-- 1. KEY SİSTEMİ -->
            <div class="admin-card">
                <h3>Key Sisteminin Şifresini Değiştir</h3>
                <div class="form-group">
                    <label>Yeni Geçerli Key:</label>
                    <input type="text" id="newKeyInput" class="form-control" placeholder="Örn: KLAKZ-YENI-KEY">
                </div>
                <button class="btn" onclick="updateKey()">Key'i Güncelle</button>
            </div>

            <!-- 2. STATUS YÖNETİMİ -->
            <div class="admin-card">
                <h3>Sistem Durumunu Değiştir (Status)</h3>
                <div class="form-group">
                    <label>Ana Hub API Durumu:</label>
                    <select id="statusApi" class="form-control">
                        <option value="ÇEVRİMİÇİ">Çevrimiçi</option>
                        <option value="BAKIMDA">Bakımda</option>
                        <option value="ÇEVRİMDIŞI">Çevrimdışı</option>
                    </select>
                </div>
                <button class="btn" onclick="updateStatus()">Durumu Güncelle</button>
            </div>

            <!-- 3. SCRİPT EKLEME -->
            <div class="admin-card">
                <h3>Yeni Script Ekle</h3>
                <div class="form-group">
                    <label>Script Adı:</label>
                    <input type="text" id="scriptTitle" class="form-control" placeholder="Örn: Hub V2">
                </div>
                <div class="form-group">
                    <label>Açıklama:</label>
                    <input type="text" id="scriptDesc" class="form-control" placeholder="Script açıklaması...">
                </div>
                <div class="form-group">
                    <label>Loadstring / Kod:</label>
                    <input type="text" id="scriptCode" class="form-control" placeholder="loadstring(...)()">
                </div>
                <button class="btn" onclick="addNewScript()">Scripti Ekle</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_SECRET = "klakz123";

        function checkAdminPassword() {
            let pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_SECRET) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function updateKey() {
            let newKey = document.getElementById('newKeyInput').value.trim();
            if (newKey) {
                localStorage.setItem("klakz_correct_key", newKey);
                alert("Key başarıyla güncellendi: " + newKey);
                document.getElementById('newKeyInput').value = '';
            } else {
                alert("Lütfen geçerli bir key yazın!");
            }
        }

        function updateStatus() {
            let apiStatus = document.getElementById('statusApi').value;
            localStorage.setItem("klakz_status_api", apiStatus);
            alert("Sistem durumu güncellendi: " + apiStatus);
        }

        function addNewScript() {
            let title = document.getElementById('scriptTitle').value;
            let desc = document.getElementById('scriptDesc').value;
            let code = document.getElementById('scriptCode').value;

            if (title && desc && code) {
                let scripts = JSON.parse(localStorage.getItem("klakz_custom_scripts")) || [];
                scripts.push({ title, desc, code });
                localStorage.setItem("klakz_custom_scripts", JSON.stringify(scripts));
                
                alert("Yeni script başarıyla eklendi ve arşive yansıtıldı!");
                document.getElementById('scriptTitle').value = '';
                document.getElementById('scriptDesc').value = '';
                document.getElementById('scriptCode').value = '';
            } else {
                alert("Lütfen tüm alanları doldurun!");
            }
        }
    </script>
</body>
</html>
