<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klakz Hub | Key System</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(13, 13, 25, 0.7);
            --neon-blue: #00f0ff;
            --neon-purple: #b000ff;
            --text-color: #ffffff;
            --text-secondary: #8b8bb4;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; position: relative; overflow-x: hidden; }

        body::before {
            content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: radial-gradient(circle, rgba(176,0,255,0.08) 10%, transparent 10%), radial-gradient(circle, rgba(0,240,255,0.05) 10%, transparent 10%);
            background-size: 30px 30px; animation: gridMove 20s linear infinite; z-index: -1;
        }
        @keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 20px 50px;
            background: rgba(5, 5, 10, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
        nav ul { display: flex; list-style: none; gap: 25px; }
        nav a { color: var(--text-secondary); text-decoration: none; font-weight: 600; transition: 0.3s; position: relative; padding: 5px 0; }
        nav a:hover, nav a.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        .container { max-width: 600px; margin: 60px auto; padding: 0 20px; text-align: center; }
        .key-box {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 40px;
            backdrop-filter: blur(15px); box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }
        .key-box h1 { font-size: 26px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .key-box p { color: var(--text-secondary); margin-bottom: 25px; font-size: 15px; }

        .btn {
            padding: 12px 30px; border-radius: 8px; font-weight: bold; text-decoration: none; cursor: pointer; transition: 0.3s;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple)); color: #fff; border: none;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); display: inline-block; font-size: 15px; margin-bottom: 20px;
        }
        .btn:hover { box-shadow: 0 0 25px var(--neon-blue), 0 0 35px var(--neon-purple); transform: scale(1.03); }

        .btn-discord {
            background: #5865F2;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
            margin-bottom: 25px;
        }
        .btn-discord:hover {
            box-shadow: 0 0 25px #5865F2;
        }

        .divider {
            height: 1px; width: 100%; background: var(--border-color); margin: 20px 0;
        }

        .key-input {
            width: 100%; padding: 14px 20px; background: rgba(5, 5, 10, 0.6); border: 1px solid var(--border-color);
            border-radius: 8px; color: #fff; font-size: 16px; margin-bottom: 15px; outline: none; text-align: center; transition: 0.3s;
        }
        .key-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }

        .error-msg { color: #ff3366; font-size: 14px; margin-top: 10px; display: none; text-shadow: 0 0 10px rgba(255,51,102,0.4); }
    </style>
</head>
<body>
    <header>
        <div class="logo">KLAKZ HUB</div>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="script.html">Scripts</a></li>
                <li><a href="key.html" class="active">Key System</a></li>
                <li><a href="status.html">Status</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="key-box">
            <h1>Key Doğrulama Sistemi</h1>
            <p>Scriptlere erişim sağlamak için önce Discord sunucumuzdan anahtar almanız gerekmektedir.</p>
            
            <!-- Discord'a Yönlendirme Butonu (Buraya kendi Discord davet linkini yazabilirsin) -->
            <a href="https://discord.gg/senin-discord-davet-linkin" target="_blank" class="btn btn-discord">1. Discord'a Git & Key Al</a>

            <div class="divider"></div>

            <p style="margin-bottom: 15px;">Aldığın Key'i buraya gir ve kilidi aç:</p>
            
            <input type="text" id="keyInput" class="key-input" placeholder="Key'i buraya yapıştır...">
            <button class="btn" onclick="checkKey()">Key'i Doğrula</button>
            
            <div id="errorMsg" class="error-msg">Geçersiz veya hatalı key! Lütfen tekrar dene.</div>
        </div>
    </div>

    <script>
        function checkKey() {
            const userKey = document.getElementById('keyInput').value.trim();
            const correctKey = "KLAKZ-2026-SECRET"; // Buraya geçerli olmasını istediğin anahtarı yazabilirsin
            const errorMsg = document.getElementById('errorMsg');

            if (userKey === correctKey) {
                // Key doğruysa tarayıcı hafızasına yetki verildiğini kaydet ve script sayfasına at
                localStorage.setItem("klakz_verified", "true");
                window.location.href = "script.html";
            } else {
                // Key yanlışsa hata mesajını göster
                errorMsg.style.display = "block";
                setTimeout(() => {
                    errorMsg.style.display = "none";
                }, 3000);
            }
        }
    </script>
</body>
</html>
