<script>
    // Mobil tarayıcılarda localStorage engellense bile hata vermemesi için try-catch kullanıyoruz
    try {
        const verified = localStorage.getItem("klakz_verified");
        if (verified !== "true") {
            // Doğrulanmamışsa veya depolama kapalıysa key sayfasına fırlat
            window.location.replace("key.html");
        }
    } catch (e) {
        // Hata alırsa (gizli sekme vb.) riske atmamak için yine key sayfasına gönder
        window.location.replace("key.html");
    }
</script>
