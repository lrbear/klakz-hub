<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klakz Hub | Scripts</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(13, 13, 25, 0.7);
            --neon-blue: #00f0ff;
            --neon-purple: #b000ff;
            --text-color: #ffffff;
            --text-secondary: #8b8bb4;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; position: relative; overflow-x: hidden; }

        body::before {
            content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: radial-gradient(circle, rgba(176,0,255,0.08) 10%, transparent 10%), radial-gradient(circle, rgba(0,240,255,0.05) 10%, transparent 10%);
            background-size: 30px 30px; animation: gridMove 20s linear infinite; z-index: -1;
        }
        @keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 20px 50px;
            background: rgba(5, 5, 10, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
        nav ul { display: flex; list-style: none; gap: 25px; }
        nav a { color: var(--text-secondary); text-decoration: none; font-weight: 600; transition: 0.3s; position: relative; padding: 5px 0; }
        nav a:hover, nav a.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-size: 32px; margin-bottom: 25px; text-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }

        .search-box {
            width: 100%; padding: 15px 20px; background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 10px; color: #fff; font-size: 16px; margin-bottom: 30px; backdrop-filter: blur(10px); outline: none; transition: 0.3s;
        }
        .search-box:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }

        .script-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .script-card {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px;
            backdrop-filter: blur(10px); transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between;
        }
        .script-card:hover { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); transform: translateY(-5px); }
        .script-card h3 { font-size: 20px; margin-bottom: 10px; color: #fff; }
        .script-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }

        .btn-copy {
            padding: 10px 20px; background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple)); border: none;
            border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .btn-copy:hover { box-shadow: 0 0 20px var(--neon-blue); transform: scale(1.02); }
    </style>
</head>
<body>
    <header>
        <div class="logo">KLAKZ HUB</div>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="script.html" class="active">Scripts</a></li>
                <li><a href="key.html">Key System</a></li>
                <li><a href="status.html">Status</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 class="page-title">Script Arşivi</h1>
        <input type="text" class="search-box" placeholder="Script ara...">
        
        <div class="script-grid">
            <div class="script-card">
                <div>
                    <h3>Universal Hub V1</h3>
                    <p>Tüm oyunlarda geçerli optimize edilmiş gelişmiş kontrol ve hile scripti.</p>
                </div>
                <button class="btn-copy" onclick="navigator.clipboard.writeText('loadstring(game:HttpGet(\"https://klakzhub.vercel.app/hub.lua\"))()')">Scripti Kopyala</button>
            </div>
            <div class="script-card">
                <div>
                    <h3>Blox Fruits & Combat</h3>
                    <p>Otomatik farm, Boss bulucu ve PVP için optimize edilmiş özel script.</p>
                </div>
                <button class="btn-copy" onclick="navigator.clipboard.writeText('print(\"Klakz Hub Blox Fruits Loaded\")')">Scripti Kopyala</button>
            </div>
        </div>
    </div>
</body>
</html>
